services:
  - type: web
    name: imf-gadget-api
    env: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: imf_gadgets
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: imf_gadgets
    plan: free
    # Empty allow list = no access from the public internet. The web service
    # still connects over Render's private network via the internal URL above.
    ipAllowList: []
